<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open-Detect 仪表盘</title>
<style>
  :root {
    --bg: #0f1923;
    --panel: #1a2733;
    --border: #243647;
    --text: #c8d6e5;
    --text-dim: #6b7f99;
    --accent: #45aaf2;
    --critical: #e74c3c;
    --warning: #f39c12;
    --success: #2ecc71;
    --pending: #4e5b6c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    font-size: 15px;
    line-height: 1.4;
    padding: 16px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 22px; font-weight: 600; color: var(--accent); }
  .header .update-time { color: var(--text-dim); font-size: 13px; }
  .header .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; background: var(--pending);
  }
  .status-dot.healthy { background: var(--success); }
  .status-dot.unhealthy { background: var(--critical); }

  /* ── Stats cards ── */
  .stats-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .stat-card {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; text-align: center;
  }
  .stat-card .stat-icon { font-size: 28px; margin-bottom: 8px; }
  .stat-card .stat-value { font-size: 40px; font-weight: 700; line-height: 1; }
  .stat-card .stat-label { font-size: 14px; color: var(--text-dim); margin-top: 8px; }
  .stat-card.normal  { border-bottom: 3px solid var(--success); }
  .stat-card.normal  .stat-value { color: var(--success); }
  .stat-card.warning { border-bottom: 3px solid var(--warning); }
  .stat-card.warning .stat-value { color: var(--warning); }
  .stat-card.critical { border-bottom: 3px solid var(--critical); }
  .stat-card.critical .stat-value { color: var(--critical); }

  /* ── Panel / table / button ── */
  .panel-box {
    flex: 1; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 14px;
  }
  .panel-box h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; }
  .alert-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .alert-table th {
    text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--border);
    color: var(--text-dim); font-weight: 500; position: sticky; top: 0;
    background: var(--panel);
  }
  .alert-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .alert-table tr:hover { background: rgba(69,170,242,0.05); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    font-size: 12px; font-weight: 600; text-transform: uppercase;
  }
  .badge-critical { background: rgba(231,76,60,0.2); color: var(--critical); }
  .badge-warning { background: rgba(243,156,18,0.2); color: var(--warning); }
  .badge-info { background: rgba(52,152,219,0.2); color: var(--info); }
  .table-wrap { max-height: 500px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  .btn {
    padding: 8px 14px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer;
    font-size: 14px; font-family: inherit; transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-danger { border-color: var(--critical) !important; color: var(--critical) !important; background: rgba(231,76,60,0.08) !important; }
  .btn-danger:hover:not(:disabled) { background: rgba(231,76,60,0.2) !important; }

  /* ── Attack button ── */
  .atk-main {
    padding: 20px 24px !important; font-size: 18px !important; font-weight: 700 !important;
    border-radius: 8px !important; width: 100%; text-align: center; transition: all 0.2s;
    border: 2px solid var(--accent) !important; color: var(--accent) !important;
    background: rgba(69,170,242,0.08) !important;
  }
  .atk-main:hover:not(:disabled) { background: rgba(69,170,242,0.2) !important; }
  .atk-main:disabled { opacity: 0.4; cursor: not-allowed; }
  .atk-hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; text-align: center; line-height: 1.5; }
  @keyframes progressPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-dot.running-pulse { animation: progressPulse 1.2s ease-in-out infinite; }

  /* ── Result table ── */
  .hdr-model { text-align: center; color: var(--accent); border-bottom: 2px solid var(--accent) !important; font-size: 14px; }
  .sub-model { color: var(--text-dim); font-size: 11px; font-weight: 400; }
  td.cell-na { color: var(--text-dim); font-style: italic; }

  /* ── 选项卡 ── */
  .tab-bar { display: flex; gap: 0; margin-bottom: 12px; }
  .tab-btn {
    padding: 6px 18px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text-dim); cursor: pointer; font-size: 13px; font-family: inherit;
    transition: all 0.15s;
  }
  .tab-btn:first-child { border-radius: 5px 0 0 5px; }
  .tab-btn:last-child { border-radius: 0 5px 5px 0; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); border-color: var(--text-dim); }
  .tab-count { font-size: 11px; opacity: 0.7; margin-left: 4px; }

  .footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="status-dot" id="status-dot"></span>
    <h1>Open-Detect 仪表盘 —— 模型检测</h1>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <button class="btn btn-danger" onclick="clearCache()" id="btn-clear" style="font-size:12px;padding:4px 10px;">清除缓存</button>
    <button class="btn" onclick="stopAttack()" id="btn-stop" style="font-size:12px;padding:4px 10px;">停止</button>
    <span id="lastUpdate" class="update-time">--</span>
  </div>
</div>

<!-- Stats cards -->
<div class="stats-row">
  <div class="stat-card normal">
    <div class="stat-icon">&#9679;</div>
    <div class="stat-value" id="stat-normal">--</div>
    <div class="stat-label">模型判定 正常流量</div>
  </div>
  <div class="stat-card warning">
    <div class="stat-icon">&#9650;</div>
    <div class="stat-value" id="stat-warning">--</div>
    <div class="stat-label">WARNING 告警</div>
  </div>
  <div class="stat-card critical">
    <div class="stat-icon">&#9632;</div>
    <div class="stat-value" id="stat-critical">--</div>
    <div class="stat-label">CRITICAL 告警</div>
  </div>
</div>

<!-- Attack button -->
<div class="panel-box" style="margin-bottom:16px;">
  <h3>发起攻击测试</h3>
  <button class="btn atk-main" onclick="triggerAttack()" id="btn-attack">
    &#9654; 发起模型检测攻击
  </button>
  <div class="atk-hint">从训练数据集注入 27 类恶意软件 + 6 类可疑工具样本，模型直接推理分类</div>
  <div id="status-bar" style="margin-top:10px;font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px;">
    <span id="status-dot2" class="status-dot" style="background:var(--pending);"></span>
    <span id="status-msg">就绪 — 点击上方按钮发起攻击</span>
    <span id="status-elapsed" style="margin-left:auto;"></span>
  </div>
</div>

<!-- Result table -->
<div class="panel-box">
  <h3>攻击结果（模型检测） <span id="result-count" style="font-weight:400;color:var(--text-dim);"></span></h3>
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" onclick="switchTab('all')">全部<span class="tab-count" id="cnt-all">0</span></button>
    <button class="tab-btn" onclick="switchTab('WARNING')">WARNING<span class="tab-count" id="cnt-warning">0</span></button>
    <button class="tab-btn" onclick="switchTab('CRITICAL')">CRITICAL<span class="tab-count" id="cnt-critical">0</span></button>
  </div>
  <div class="table-wrap">
    <table class="alert-table" id="result-table">
      <thead>
        <tr>
          <th style="width:60px;">时间</th>
          <th style="width:90px;">攻击类型</th>
          <th style="width:150px;">源 → 目标</th>
          <th class="hdr-model" colspan="3">模型检测结果</th>
        </tr>
        <tr>
          <th></th><th></th><th></th>
          <th class="sub-model">类型</th>
          <th class="sub-model">等级</th>
          <th class="sub-model">置信度</th>
        </tr>
      </thead>
      <tbody id="result-table-body">
        <tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:24px;">暂无数据 — 点击上方按钮发起攻击</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 正常流量列表 -->
<div class="panel-box" style="margin-top:16px;">
  <h3>正常流量列表 <span id="normal-flow-count" style="font-weight:400;color:var(--text-dim);"></span></h3>
  <div class="table-wrap">
    <table class="alert-table" id="normal-flow-table">
      <thead>
        <tr>
          <th style="width:60px;">时间</th>
          <th style="width:120px;">源 IP</th>
          <th style="width:120px;">目标 IP</th>
          <th style="width:50px;">协议</th>
          <th style="width:90px;">分类</th>
          <th style="width:60px;">置信度</th>
          <th style="width:60px;">状态</th>
        </tr>
      </thead>
      <tbody id="normal-flow-table-body">
        <tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:24px;">暂无正常流量数据</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="footer">Open-Detect Test Dashboard · 每 3 秒自动刷新</div>

<script>
/* ── 全局状态 ── */
var _allAlerts = [];
var _activeTab = 'all';

/* ── 攻击触发 ── */
function triggerAttack() {
  logStatus('发起: 模型检测攻击 ...');
  disableBtn(true);
  fetch('/api/test/trigger', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: 'model' })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) { logStatus('模型检测攻击 — 已启动 (' + d.total + ' 个攻击)'); }
      else { logStatus('攻击 — 失败: ' + (d.message || '')); disableBtn(false); }
    })
    .catch(function(e) { logStatus('攻击 — 错误'); disableBtn(false); });
}

function disableBtn(dis) {
  document.getElementById('btn-attack').disabled = dis;
}

function logStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

function stopAttack() {
  fetch('/api/attack/stop', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function() { disableBtn(false); });
}

/* ── 格式化 ── */
function fmtTime(ts) {
  var d = new Date(ts * 1000);
  return d.toTimeString().substring(0, 8);
}
function fmtUptime(s) {
  s = Math.floor(s);
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h > 0 ? h + ':' : '') + (m < 10 && h > 0 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
}

/* ── 统计面板 ── */
function loadSummary() {
  fetch('/api/summary')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var dot = document.getElementById('status-dot');
      dot.className = 'status-dot healthy';

      document.getElementById('lastUpdate').textContent = '更新 ' + fmtTime(d.server_time);
      document.getElementById('stat-normal').textContent = d.model_normal || 0;
      document.getElementById('stat-warning').textContent = d.model_warning || 0;
      document.getElementById('stat-critical').textContent = d.model_critical || 0;
    })
    .catch(function() {
      document.getElementById('status-dot').className = 'status-dot unhealthy';
    });
}

/* ── 选项卡切换 ── */
function switchTab(tab) {
  _activeTab = tab;
  var btns = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
  }
  var activeBtn = document.querySelector('.tab-btn[onclick*=\"' + tab + '\"]');
  if (activeBtn) activeBtn.classList.add('active');
  renderActiveTable();
}

function renderActiveTable() {
  var filtered = _allAlerts;
  if (_activeTab === 'WARNING') {
    filtered = _allAlerts.filter(function(a) {
      var extra = (typeof a.extra === 'string' ? JSON.parse(a.extra) : (a.extra || {}));
      var mr = extra.model_result || {};
      return mr.alert_level === 'WARNING';
    });
  } else if (_activeTab === 'CRITICAL') {
    filtered = _allAlerts.filter(function(a) {
      var extra = (typeof a.extra === 'string' ? JSON.parse(a.extra) : (a.extra || {}));
      var mr = extra.model_result || {};
      return mr.alert_level === 'CRITICAL';
    });
  }
  renderTableInner(filtered);

  // 更新选项卡计数
  var cntAll = _allAlerts.length;
  var cntWarning = _allAlerts.filter(function(a) {
    var extra = (typeof a.extra === 'string' ? JSON.parse(a.extra) : (a.extra || {}));
    var mr = extra.model_result || {};
    return mr.alert_level === 'WARNING';
  }).length;
  var cntCritical = _allAlerts.filter(function(a) {
    var extra = (typeof a.extra === 'string' ? JSON.parse(a.extra) : (a.extra || {}));
    var mr = extra.model_result || {};
    return mr.alert_level === 'CRITICAL';
  }).length;
  document.getElementById('cnt-all').textContent = cntAll;
  document.getElementById('cnt-warning').textContent = cntWarning;
  document.getElementById('cnt-critical').textContent = cntCritical;
}

/* ── 告警表格 ── */
function loadAlerts() {
  fetch('/api/alerts?source=model&limit=500')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      _allAlerts = d.alerts || [];
      renderActiveTable();
    })
    .catch(function() {});
}

function renderTableInner(alerts) {
  var tbody = document.getElementById('result-table-body');
  if (!alerts.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:24px;">暂无数据 — 点击上方按钮发起攻击</td></tr>';
    document.getElementById('result-count').textContent = '(共 0 条)';
    return;
  }
  var html = '';
  for (var i = 0; i < alerts.length; i++) {
    var a = alerts[i];
    var extra = (typeof a.extra === 'string' ? JSON.parse(a.extra) : (a.extra || {}));
    var mr = extra.model_result || {};

    function levelBadge(lv) {
      var cls = lv === 'CRITICAL' ? 'badge-critical' : lv === 'WARNING' ? 'badge-warning' : 'badge-info';
      return '<span class="badge ' + cls + '">' + (lv || '—') + '</span>';
    }
    function confStr(cf) {
      return cf != null && cf > 0 ? (cf * 100).toFixed(0) + '%' : '<span class="cell-na">—</span>';
    }
    function typeStr(v, r) {
      var cn = (r && r.class_name) ? r.class_name : v;
      return cn || '<span class="cell-na">—</span>';
    }
    function attackTypeLabel(t) {
      var m = { 'known_malware': '已知恶意', 'normal': '正常流量', 'unknown_attack': '未知攻击',
                 'port_scan': '端口扫描', 'syn_flood': 'SYN Flood', 'c2_beaconing': 'C2通信' };
      return m[t] || t;
    }
    var atLabel = attackTypeLabel(a.attack_type);

    html += '<tr>' +
      '<td>' + fmtTime(a.timestamp) + '</td>' +
      '<td>' + (atLabel || '<span class="cell-na">—</span>') + '</td>' +
      '<td>' + (a.src_ip || '?') + ':' + (a.src_port || 0) + ' → ' + (a.dst_ip || '?') + ':' + (a.dst_port || 0) + '</td>' +
      '<td>' + typeStr(mr.attack_type, mr) + '</td>' +
      '<td>' + levelBadge(mr.alert_level) + '</td>' +
      '<td>' + confStr(mr.confidence) + '</td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
  document.getElementById('result-count').textContent = '(共 ' + alerts.length + ' 条)';
}

/* ── 攻击状态轮询 ── */
function checkAttackStatus() {
  fetch('/api/attack/status')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var dot2 = document.getElementById('status-dot2');
      if (d.running) {
        dot2.className = 'status-dot running-pulse';
        dot2.style.background = 'var(--warning)';
        document.getElementById('status-msg').textContent = '执行中: ' + (d.name || '—');
        document.getElementById('status-elapsed').textContent = '耗时 ' + fmtUptime(d.elapsed_s || 0);
        disableBtn(true);
      } else {
        dot2.className = 'status-dot';
        dot2.style.background = 'var(--pending)';
        document.getElementById('status-msg').textContent = '就绪 — 点击上方按钮发起攻击';
        document.getElementById('status-elapsed').textContent = '';
        disableBtn(false);
      }
    })
    .catch(function() {});
}

/* ── 初始化 ── */
loadSummary();
loadAlerts();
loadNormalFlows();
checkAttackStatus();
setInterval(loadSummary, 3000);
setInterval(loadAlerts, 5000);
setInterval(loadNormalFlows, 6000);
setInterval(checkAttackStatus, 1000);

/* ── 清除缓存 ── */
function clearCache() {
  _allAlerts = [];
  renderActiveTable();
  document.getElementById('stat-normal').textContent = '0';
  document.getElementById('stat-warning').textContent = '0';
  document.getElementById('stat-critical').textContent = '0';
  document.getElementById('normal-flow-table-body').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:24px;">暂无正常流量数据</td></tr>';
  document.getElementById('normal-flow-count').textContent = '';
  fetch('/api/admin/clear', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function() { loadSummary(); loadNormalFlows(); })
    .catch(function() { loadSummary(); loadNormalFlows(); });
}

/* ── 正常流量列表 ── */
function loadNormalFlows() {
  fetch('/api/flows/normal?limit=100')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var flows = d.flows || [];
      var tbody = document.getElementById('normal-flow-table-body');
      document.getElementById('normal-flow-count').textContent = '(共 ' + flows.length + ' 条)';
      if (!flows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:24px;">暂无正常流量数据</td></tr>';
        return;
      }
      var html = '';
      for (var i = 0; i < flows.length; i++) {
        var f = flows[i];
        var confStr = function(cf) { return cf != null && cf > 0 ? (cf * 100).toFixed(1) + '%' : '<span class="cell-na">—</span>'; };
        html += '<tr>' +
          '<td>' + fmtTime(f.timestamp) + '</td>' +
          '<td>' + (f.src_ip || '—') + '</td>' +
          '<td>' + (f.dst_ip || '—') + '</td>' +
          '<td>' + (f.protocol || '—') + '</td>' +
          '<td>' + (f.class_name || '—') + '</td>' +
          '<td>' + confStr(f.confidence) + '</td>' +
          '<td><span class="badge badge-info">正常</span></td>' +
        '</tr>';
      }
      tbody.innerHTML = html;
    })
    .catch(function() {});
}
</script>

</body>
</html>
