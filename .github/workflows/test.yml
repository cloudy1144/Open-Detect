name: Open-Detect Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev tcpdump

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install numpy Pillow tqdm scikit-learn scapy pyyaml
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-timeout

      - name: Verify model file exists
        run: |
          ls -lh save_model/mixed_44_split_0.pt
          python -c "
          import torch
          model = torch.load('save_model/mixed_44_split_0.pt', map_location='cpu', weights_only=False)
          print(f'Model loaded: {model.n_classes} classes')
          "

      - name: Run tests
        run: |
          python -m pytest tests/test_detection.py tests/test_performance.py \
            -v --timeout 120 --tb=short \
            --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            pytest-report.xml
            health.json
            alerts.db
          retention-days: 7
